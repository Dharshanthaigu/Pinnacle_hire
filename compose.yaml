services:
  auth-service:
    image: auth-service
    container_name: auth-service
    build: ./src/auth-service
    env_file:
      - ./src/auth-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
    expose:
      - 5001
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
    networks:
      - backend-ns

  job-service:
    image: job-service
    container_name: job-service
    build: ./src/job-service
    env_file:
      - ./src/job-service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - REDIS_URL=redis://redis:6379
    expose:
      - 5002
    ports:
      - "5002:5002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
      - auth-service
    networks:
      - backend-ns

  redis:
    image: redis:7-alpine
    container_name: pinnacle-redis
    expose:
      - 6379
    volumes:
      - redis-data:/data
    networks:
      - backend-ns

volumes:
  redis-data:

networks:
  backend-ns: