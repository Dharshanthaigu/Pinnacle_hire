services:
  auth-service:
    image: auth-service
    container_name: auth-service
    build: ./src/auth-service
    env_file:
      - ./src/auth-service/.env
    environment:
      - REDIS_URL=redis://redis:6379
    expose:
      - 5001
    ports:
      - "5001:5001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
    networks:
      - backend-ns

  job-service:
    image: job-service
    container_name: job-service
    build: ./src/job-service
    env_file:
      - ./src/job-service/.env
    environment:
      - AUTH_SERVICE_URL=http://auth-service:5001
      - REDIS_URL=redis://redis:6379
    expose:
      - 5002
    ports:
      - "5002:5002"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5002/health" ]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
      - auth-service
    networks:
      - backend-ns

  redis:
    image: redis:7-alpine
    container_name: pinnacle-redis
    expose:
      - 6379
    volumes:
      - redis-data:/data
    networks:
      - backend-ns

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - job-service
    networks:
      - backend-ns

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - backend-ns

  gateway:
    image: nginx:alpine
    container_name: gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - job-service
    networks:
      - backend-ns

volumes:
  redis-data:
  grafana-data:

networks:
  backend-ns: